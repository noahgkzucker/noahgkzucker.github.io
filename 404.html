<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Page Not Found</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://use.typekit.net/bpz6lzu.css?v=20260722">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
    integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="/styles.css">
  <script>
    if (/^\/(?:research|courses)(?:\.html|\/)?$/.test(window.location.pathname)) {
      window.location.replace("/");
    }
  </script>
</head>

<body class="error-page">
  <main class="error-layout">
    <p class="error-code" aria-hidden="true">404</p>

    <div class="error-content">
      <h1>Page not found</h1>
      <p>The page you requested does not exist.</p>

      <a class="home-link" href="/">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        <span>Back to noahzucker.com</span>
      </a>
    </div>
  </main>
</body>
</html>
